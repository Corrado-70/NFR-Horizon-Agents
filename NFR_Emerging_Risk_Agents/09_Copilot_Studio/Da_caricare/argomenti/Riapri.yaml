kind: AdaptiveDialog
beginDialog:
  kind: OnActivity
  id: main
  type: Message
  condition: =StartsWith(System.Activity.Text, "Riapri")
  actions:
    - kind: SetVariable
      id: setVariable_rischi
      variable: init:Topic.rischi
      value: =Concat(MatchAll(System.Activity.Text, "NFR-\d{2}"), FullMatch, ",")

    - kind: SetVariable
      id: setVariable_ambito
      variable: init:Topic.ambito
      value: =If(IsBlank(Topic.rischi), "tutti i rischi", Topic.rischi)

    - kind: Question
      id: question_conferma
      variable: init:Topic.conferma
      prompt: "Riapro la validazione del ciclo corrente per {Topic.ambito}: la griglia torna con i valori validati, da modificare e poi applicare con Valida. Confermi? Scrivi si per procedere."
      entity: StringPrebuiltEntity
      alwaysPrompt: true
      interruptionPolicy:
        allowInterruption: false

    - kind: ConditionGroup
      id: conditionGroup_conferma
      conditions:
        - id: conditionItem_non_confermato
          condition: =Lower(Left(Trim(Topic.conferma), 1)) <> "s"
          actions:
            - kind: SendActivity
              id: sendActivity_non_confermato
              activity: Riapertura non avviata. Il registro non e' stato toccato.

            - kind: CancelAllDialogs
              id: cancelAllDialogs_conferma

    - kind: InvokeFlowAction
      id: invokeFlowAction_motore
      displayName: NFR_Motore
      input:
        binding:
          text: ="riapri"
          text_1: =""
          text_2: ="rischi=" & Topic.rischi
          text_3: =System.User.DisplayName & " <" & System.User.PrincipalName & ">"

      output:
        binding:
          esito: Topic.esito_motore
          messaggio: Topic.messaggio_motore

      flowId: <<ID_FLUSSO_NFR_Motore>>

    - kind: SendActivity
      id: sendActivity_motore
      activity: "{Topic.messaggio_motore}"

    - kind: CancelAllDialogs
      id: cancelAllDialogs_fine

inputType: {}
outputType: {}

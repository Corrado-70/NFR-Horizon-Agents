kind: AdaptiveDialog
beginDialog:
  kind: OnActivity
  id: main
  type: Message
  condition: =StartsWith(System.Activity.Text, "Valida")
  actions:
    - kind: SetVariable
      id: setVariable_periodo
      variable: init:Topic.periodo
      value: =Match(System.Activity.Text, "(\d{4}Q[1-4](-S[1-9])?|\d{4}-\d{2}-\d{2})").FullMatch

    - kind: ConditionGroup
      id: conditionGroup_periodo
      conditions:
        - id: conditionItem_periodo_mancante
          condition: =IsBlank(Topic.periodo)
          actions:
            - kind: Question
              id: question_periodo
              variable: Topic.periodo
              prompt: Quale periodo validare? Un ciclo (2027Q1, 2027Q1-S1) o una settimana (data del lunedi', 2026-10-19).
              entity: StringPrebuiltEntity
              alwaysPrompt: true
              interruptionPolicy:
                allowInterruption: false

    - kind: ConditionGroup
      id: conditionGroup_formato
      conditions:
        - id: conditionItem_formato_errato
          condition: =Not(IsMatch(Trim(Topic.periodo), "(\d{4}Q[1-4](-S[1-9])?|\d{4}-\d{2}-\d{2})"))
          actions:
            - kind: SendActivity
              id: sendActivity_formato_errato
              activity: "Periodo non valido: {Topic.periodo}. Scrivi per esempio Valida 2027Q1."

            - kind: CancelAllDialogs
              id: cancelAllDialogs_formato

    - kind: Question
      id: question_conferma
      variable: init:Topic.conferma
      prompt: "Applico al registro le decisioni della griglia di validazione per {Topic.periodo}, a nome di {System.User.DisplayName}. Confermi? Scrivi si per procedere."
      entity: StringPrebuiltEntity
      alwaysPrompt: true
      interruptionPolicy:
        allowInterruption: false

    - kind: ConditionGroup
      id: conditionGroup_conferma
      conditions:
        - id: conditionItem_non_confermato
          condition: =Lower(Left(Trim(Topic.conferma), 1)) <> "s"
          actions:
            - kind: SendActivity
              id: sendActivity_non_confermato
              activity: Validazione non avviata. Il registro non e' stato toccato.

            - kind: CancelAllDialogs
              id: cancelAllDialogs_conferma

    - kind: InvokeFlowAction
      id: invokeFlowAction_motore
      displayName: NFR_Motore
      input:
        binding:
          text: ="valida"
          text_1: =Trim(Topic.periodo)
          text_2: =""
          text_3: =System.User.DisplayName & " <" & System.User.PrincipalName & ">"

      output:
        binding:
          esito: Topic.esito_motore
          messaggio: Topic.messaggio_motore

      flowId: <<ID_FLUSSO_NFR_Motore>>

    - kind: SendActivity
      id: sendActivity_motore
      activity: "{Topic.messaggio_motore}"

    - kind: CancelAllDialogs
      id: cancelAllDialogs_fine

inputType: {}
outputType: {}

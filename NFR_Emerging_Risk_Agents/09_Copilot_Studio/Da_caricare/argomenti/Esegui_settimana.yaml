kind: AdaptiveDialog
beginDialog:
  kind: OnActivity
  id: main
  type: Message
  condition: =StartsWith(System.Activity.Text, "Esegui_settimana")
  actions:
    - kind: SetVariable
      id: setVariable_azzera_ingresso
      variable: Global.ingresso
      value: =Blank()

    - kind: SetVariable
      id: setVariable_azzera_uscita
      variable: Global.uscita
      value: =Blank()

    - kind: SetVariable
      id: setVariable_periodo
      variable: Global.periodo
      value: =Match(System.Activity.Text, "\d{4}-\d{2}-\d{2}").FullMatch

    - kind: ConditionGroup
      id: conditionGroup_periodo
      conditions:
        - id: conditionItem_periodo_mancante
          condition: =IsBlank(Global.periodo)
          actions:
            - kind: Question
              id: question_periodo
              variable: Global.periodo
              prompt: Quale settimana? Scrivi la data del lunedi', per esempio 2026-10-19.
              entity: StringPrebuiltEntity
              alwaysPrompt: true
              interruptionPolicy:
                allowInterruption: false

    - kind: ConditionGroup
      id: conditionGroup_formato
      conditions:
        - id: conditionItem_formato_errato
          condition: =Not(IsMatch(Trim(Global.periodo), "\d{4}-\d{2}-\d{2}"))
          actions:
            - kind: SendActivity
              id: sendActivity_formato_errato
              activity: "Settimana non valida: {Global.periodo}. Serve la data di un lunedi', per esempio Esegui_settimana 2026-10-19."

            - kind: CancelAllDialogs
              id: cancelAllDialogs_formato

    - kind: InvokeFlowAction
      id: invokeFlowAction_leggi_baseline
      displayName: Leggi_File
      input:
        binding:
          text: ="BASE"
          text_1: ="Baseline_corrente.json"

      output:
        binding:
          caratteri: Topic.caratteri_input
          esito: Topic.esito_lettura
          testo: Global.ingresso

      flowId: <<ID_FLUSSO_Leggi_File>>

    - kind: ConditionGroup
      id: conditionGroup_lettura
      conditions:
        - id: conditionItem_lettura_fallita
          condition: =Topic.esito_lettura <> "ok"
          actions:
            - kind: SendActivity
              id: sendActivity_lettura_fallita
              activity: "Baseline_corrente.json non trovata in Archivio_Cicli ({Topic.esito_lettura}): il registro non ha ancora un ciclo validato."

            - kind: CancelAllDialogs
              id: cancelAllDialogs_lettura

    - kind: SendActivity
      id: sendActivity_avvio
      activity: "Baseline letta: {Topic.caratteri_input} caratteri. Avvio di A3 sulle notizie della settimana del {Global.periodo}: possono servire alcuni minuti."

    - kind: BeginDialog
      id: beginDialog_a3
      displayName: A3 Interim Update
      dialog: <<ID_AGENTE_A3>>
      output:
        binding:
          output: Global.uscita

    - kind: ConditionGroup
      id: conditionGroup_uscita
      conditions:
        - id: conditionItem_uscita_vuota
          condition: =Len(Global.uscita) < 200
          actions:
            - kind: SendActivity
              id: sendActivity_uscita_vuota
              activity: "A3 non ha prodotto il JSON della settimana. Inizio della risposta: {Left(Global.uscita, 300)}"

            - kind: CancelAllDialogs
              id: cancelAllDialogs_uscita

    - kind: InvokeFlowAction
      id: invokeFlowAction_salva
      displayName: Salva_JSON
      input:
        binding:
          text: ="A3_" & Global.periodo & ".json"
          text_1: =Global.uscita

      output:
        binding:
          caratteri: Topic.caratteri_salvati
          esito: Topic.esito_salvataggio

      flowId: <<ID_FLUSSO_Salva_JSON>>

    - kind: SendActivity
      id: sendActivity_salvato
      activity: "{Topic.esito_salvataggio}: In_arrivo/A3_{Global.periodo}.json, {Topic.caratteri_salvati} caratteri salvati su {Len(Global.uscita)} prodotti."

    - kind: InvokeFlowAction
      id: invokeFlowAction_motore
      displayName: NFR_Motore
      input:
        binding:
          text: ="settimanale"
          text_1: =Global.periodo
          text_2: =""
          text_3: =System.User.DisplayName & " <" & System.User.PrincipalName & ">"

      output:
        binding:
          esito: Topic.esito_motore
          messaggio: Topic.messaggio_motore

      flowId: <<ID_FLUSSO_NFR_Motore>>

    - kind: SendActivity
      id: sendActivity_motore
      activity: "{Topic.messaggio_motore}"

    - kind: CancelAllDialogs
      id: cancelAllDialogs_fine

inputType: {}
outputType: {}

kind: AdaptiveDialog
beginDialog:
  kind: OnActivity
  id: main
  type: Message
  condition: =StartsWith(System.Activity.Text, "Dismetti")
  actions:
    - kind: SetVariable
      id: setVariable_rischio
      variable: init:Topic.rischio
      value: =Match(System.Activity.Text, "NFR-\d{2}").FullMatch

    - kind: ConditionGroup
      id: conditionGroup_rischio
      conditions:
        - id: conditionItem_rischio_mancante
          condition: =IsBlank(Topic.rischio)
          actions:
            - kind: SendActivity
              id: sendActivity_rischio_mancante
              activity: Indica il rischio da dismettere, per esempio Dismetti NFR-07.

            - kind: CancelAllDialogs
              id: cancelAllDialogs_rischio

    - kind: Question
      id: question_motivazione
      variable: init:Topic.motivazione
      prompt: "Perche' dismettere {Topic.rischio}? Almeno 10 caratteri: resta nello storico del registro."
      entity: StringPrebuiltEntity
      alwaysPrompt: true
      interruptionPolicy:
        allowInterruption: false

    - kind: ConditionGroup
      id: conditionGroup_motivazione
      conditions:
        - id: conditionItem_motivazione_corta
          condition: =Len(Trim(Topic.motivazione)) < 10
          actions:
            - kind: SendActivity
              id: sendActivity_motivazione_corta
              activity: Motivazione troppo breve (almeno 10 caratteri). Dismissione non avviata.

            - kind: CancelAllDialogs
              id: cancelAllDialogs_motivazione

    - kind: Question
      id: question_conferma
      variable: init:Topic.conferma
      prompt: "Dismetto {Topic.rischio} a nome di {System.User.DisplayName}: esce dal radar, i suoi KRI non sono piu' in vigore e le azioni aperte sono annullate. Confermi? Scrivi si per procedere."
      entity: StringPrebuiltEntity
      alwaysPrompt: true
      interruptionPolicy:
        allowInterruption: false

    - kind: ConditionGroup
      id: conditionGroup_conferma
      conditions:
        - id: conditionItem_non_confermato
          condition: =Lower(Left(Trim(Topic.conferma), 1)) <> "s"
          actions:
            - kind: SendActivity
              id: sendActivity_non_confermato
              activity: Dismissione non avviata. Il registro non e' stato toccato.

            - kind: CancelAllDialogs
              id: cancelAllDialogs_conferma

    - kind: InvokeFlowAction
      id: invokeFlowAction_motore
      displayName: NFR_Motore
      input:
        binding:
          text: ="dismetti"
          text_1: =""
          text_2: ="rischio=" & Topic.rischio & Char(10) & "motivazione=" & Substitute(Trim(Topic.motivazione), Char(10), " ")
          text_3: =System.User.DisplayName & " <" & System.User.PrincipalName & ">"

      output:
        binding:
          esito: Topic.esito_motore
          messaggio: Topic.messaggio_motore

      flowId: <<ID_FLUSSO_NFR_Motore>>

    - kind: SendActivity
      id: sendActivity_motore
      activity: "{Topic.messaggio_motore}"

    - kind: CancelAllDialogs
      id: cancelAllDialogs_fine

inputType: {}
outputType: {}
